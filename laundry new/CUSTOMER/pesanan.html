<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LaundryKita - Pesan Laundry</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="customer.html">
                LaundryKita
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="customer.html">

                            Beranda

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="pesanan.html">

                            Pesanan

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="profil.html">

                            Profil

                        </a>

                    </li>

                    <li class="nav-item ms-lg-2">

                        <a
                            class="btn btn-outline-danger btn-sm mt-1"
                            href="../index.html">

                            Keluar

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- FORM PESANAN -->
    <section class="container py-5">

        <div class="text-center mb-5">

            <h2 class="fw-bold">
                Pesan Laundry
            </h2>

            <p class="text-muted">
                Isi data pesanan laundry kamu
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow-sm rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <form id="formPesanan">

                            <!-- NAMA -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="namaPelanggan">
                                    Nama Pelanggan
                                </label>

                                <input
                                    type="text"
                                    id="namaPelanggan"
                                    class="form-control"
                                    value="Salwa">

                            </div>


                            <!-- LAYANAN -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="pilihLayanan">
                                    Pilih Layanan
                                </label>

                                <select id="pilihLayanan" class="form-select">

                                    <option value="Cuci Kering" data-price="7000">
                                        Cuci Kering - Rp7.000/kg
                                    </option>

                                    <option value="Cuci Setrika" data-price="10000" selected>
                                        Cuci Setrika - Rp10.000/kg
                                    </option>

                                    <option value="Setrika Saja" data-price="6000">
                                        Setrika Saja - Rp6.000/kg
                                    </option>

                                </select>

                            </div>


                            <!-- BERAT -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="beratLaundry">
                                    Berat Laundry
                                </label>

                                <div class="input-group">

                                    <input
                                        type="number"
                                        id="beratLaundry"
                                        class="form-control"
                                        min="0"
                                        step="0.1"
                                        value="3">

                                    <span class="input-group-text">
                                        Kg
                                    </span>

                                </div>

                            </div>


                            <!-- TOTAL -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="totalPesanan">
                                    Total
                                </label>

                                <input
                                    type="text"
                                    id="totalPesanan"
                                    class="form-control fw-bold"
                                    value="Rp30.000"
                                    readonly>

                            </div>


                            <!-- ALAMAT -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="alamatPesanan">
                                    Alamat
                                </label>

                                <textarea
                                    id="alamatPesanan"
                                    class="form-control"
                                    rows="3">Jl. Contoh No. 10, Pekanbaru</textarea>

                            </div>


                            <!-- CATATAN -->
                            <div class="mb-4">

                                <label class="form-label fw-semibold" for="catatanPesanan">
                                    Catatan
                                </label>

                                <textarea
                                    id="catatanPesanan"
                                    class="form-control"
                                    rows="3"
                                    placeholder="Tambahkan catatan jika diperlukan"></textarea>

                            </div>


                            <div
                                id="pesananError"
                                class="alert alert-danger d-none mb-3">
                            </div>


                            <!-- KONFIRMASI -->
                            <div class="d-grid">

                                <button
                                    type="submit"
                                    class="btn btn-primary btn-lg rounded-3">

                                    Konfirmasi Pesanan

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->
    <footer class="text-center py-4 bg-white">

        <p class="mb-0 text-muted">

            © 2026 LaundryKita —
            Sistem Pemesanan Laundry

        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        const pilihLayanan = document.getElementById("pilihLayanan");
        const beratLaundry = document.getElementById("beratLaundry");
        const totalPesanan = document.getElementById("totalPesanan");
        const formPesanan = document.getElementById("formPesanan");
        const pesananError = document.getElementById("pesananError");
        const alamatPesanan = document.getElementById("alamatPesanan");

        function formatRupiah(amount) {
            return "Rp" + amount.toLocaleString("id-ID");
        }

        function updateTotal() {
            const selected = pilihLayanan.options[pilihLayanan.selectedIndex];
            const pricePerKg = parseInt(selected.dataset.price, 10) || 0;
            const berat = parseFloat(beratLaundry.value) || 0;
            totalPesanan.value = formatRupiah(Math.round(pricePerKg * berat));
        }

        pilihLayanan.addEventListener("change", updateTotal);
        beratLaundry.addEventListener("input", updateTotal);
        beratLaundry.addEventListener("change", updateTotal);

        formPesanan.addEventListener("submit", function (event) {
            event.preventDefault();
            pesananError.classList.add("d-none");

            const berat = parseFloat(beratLaundry.value);
            const alamat = alamatPesanan.value.trim();

            if (!berat || berat <= 0) {
                pesananError.textContent = "Berat laundry harus lebih dari 0 kg.";
                pesananError.classList.remove("d-none");
                return;
            }

            if (!alamat) {
                pesananError.textContent = "Alamat tidak boleh kosong.";
                pesananError.classList.remove("d-none");
                return;
            }

            window.location.href = "status-pesanan.html";
        });

        updateTotal();
    </script>

</body>

</html>
