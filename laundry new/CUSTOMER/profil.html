<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LaundryKita - Profil</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../CSS/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">

        <div class="container">

            <a class="navbar-brand fw-bold" href="customer.html">
                LaundryKita
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="customer.html">

                            Beranda

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link"
                            href="pesanan.html">

                            Pesanan

                        </a>
                    </li>

                    <li class="nav-item">
                        <a
                            class="nav-link active"
                            href="profil.html">

                            Profil

                        </a>
                    </li>

                    <li class="nav-item ms-lg-2">
                        <a
                            class="btn btn-outline-danger btn-sm mt-1"
                            href="../index.html">

                            Keluar

                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- PROFIL -->
    <section class="container py-5">

        <div class="text-center mb-5">

            <h2 class="fw-bold">
                Profil Saya
            </h2>

            <p class="text-muted">
                Kelola informasi akun kamu
            </p>

        </div>


        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow-sm rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <!-- FOTO PROFIL -->
                        <div class="text-center mb-4">

                            <div class="profile-avatar" aria-label="Foto profil">
                                👤
                            </div>

                            <h4 class="fw-bold mt-3 mb-1">
                                Salwachika Deri
                            </h4>

                            <p class="text-muted">
                                Customer LaundryKita
                            </p>

                        </div>


                        <!-- FORM PROFIL -->
                        <form>

                            <!-- NAMA -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="namaLengkap">
                                    Nama Lengkap
                                </label>

                                <input
                                    type="text"
                                    id="namaLengkap"
                                    class="form-control"
                                    value="Salwachika Deri">

                            </div>


                            <!-- EMAIL -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="emailProfil">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="emailProfil"
                                    class="form-control"
                                    value="salwa@email.com">

                            </div>


                            <!-- NOMOR HP -->
                            <div class="mb-3">

                                <label class="form-label fw-semibold" for="nomorHp">
                                    Nomor HP
                                </label>

                                <input
                                    type="text"
                                    id="nomorHp"
                                    class="form-control"
                                    value="081234567890">

                            </div>


                            <!-- ALAMAT -->
                            <div class="mb-4">

                                <label class="form-label fw-semibold" for="alamatProfil">
                                    Alamat
                                </label>

                                <textarea
                                    id="alamatProfil"
                                    class="form-control"
                                    rows="3">Jl. Contoh No. 10, Pekanbaru</textarea>

                            </div>


                            <!-- SIMPAN -->
                            <div class="d-grid">

                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    data-bs-toggle="modal"
                                    data-bs-target="#successModal">

                                    Simpan Perubahan

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- MODAL BERHASIL -->
    <div
        class="modal fade"
        id="successModal"
        tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title fw-bold">
                        Berhasil
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body text-center">

                    <div class="display-5 mb-3">
                        ✓
                    </div>

                    <p class="mb-0">
                        Perubahan profil berhasil disimpan.
                    </p>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-primary"
                        data-bs-dismiss="modal">

                        Tutup

                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- FOOTER -->
    <footer class="text-center py-4 bg-white">

        <p class="mb-0 text-muted">

            © 2026 LaundryKita —
            Sistem Pemesanan Laundry

        </p>

    </footer>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
